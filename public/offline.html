        min-height: 100dvh;

        line-height: 1.5;
        color: rgba(255, 255, 255, 0.45);

        margin-top: 32px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 14px;
        background: #0066ff;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:active {

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0c0d10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Нет интернета — pnk ID</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #0c0d10;
        color: #fff;
        font-family: Manrope, system-ui, -apple-system, Segoe UI, sans-serif;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 18px;
        background: #1a1c22;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.55);
      }
      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.03em;
        font-weight: 600;
      }
      p {
        margin: 12px 0 0;
        font-size: 15px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.45);
      }
      button {
        margin-top: 32px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 14px;
        background: #0066ff;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:active {
        background: #0052cc;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
            <path
              d="M2 8.82A15.91 15.91 0 0 1 12 5c2.5 0 4.84.58 6.92 1.6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M5.5 12.5A10.94 10.94 0 0 1 12 10c1.6 0 3.1.34 4.45.95"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M8.7 15.8A5.97 5.97 0 0 1 12 15c.9 0 1.74.2 2.5.55"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <circle cx="12" cy="19" r="1.35" fill="currentColor" />
            <path
              d="M4 4l16 16"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <h1>Нет интернета</h1>
        <p>Проверьте подключение и попробуйте обновить страницу.</p>
        <button type="button" onclick="location.reload()">
          Обновить страницу
        </button>
      </div>
    </div>
  </body>
</html>

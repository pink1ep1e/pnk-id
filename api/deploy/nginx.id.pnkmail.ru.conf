# Example Nginx for id.pnkmail.ru
# API (Nest) on 127.0.0.1:3100 — /v1, /.well-known, /health, /telegram
# UI (Next) on 127.0.0.1:3101 — everything else
#
# sudo cp deploy/nginx.id.pnkmail.ru.conf /etc/nginx/sites-available/id.pnkmail.ru
# sudo ln -sf /etc/nginx/sites-available/id.pnkmail.ru /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# sudo certbot --nginx -d id.pnkmail.ru

upstream pnk_id_api {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream pnk_id_web {
    server 127.0.0.1:3101;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name id.pnkmail.ru;

    # After certbot, this block is usually upgraded to 443 + redirect.

    client_max_body_size 2m;

    location /v1/ {
        proxy_pass http://pnk_id_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /.well-known/ {
        proxy_pass http://pnk_id_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://pnk_id_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /telegram/webhook {
        proxy_pass http://pnk_id_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
    }

    location / {
        proxy_pass http://pnk_id_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
